services:
  web:
    build:
      context: .
      target: proxy
    expose:
      - "8000"
    depends_on:
      django:
        condition: service_healthy
    volumes:
      - acordemos-data:/srv/data:ro
    restart: unless-stopped

  django:
    build:
      context: .
      target: wsgi
    environment:
      ACORDEMOS_DATA_DIR: /data
      DJANGO_DEBUG: "0"
      DJANGO_HTTPS_PROXY: "1"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:?}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?}"
      GOOGLE_OAUTH2_KEY: "${GOOGLE_OAUTH2_KEY:-}"
      GOOGLE_OAUTH2_SECRET: "${GOOGLE_OAUTH2_SECRET:-}"
      DJANGO_EMAIL_BACKEND: "${DJANGO_EMAIL_BACKEND:-django.core.mail.backends.dummy.EmailBackend}"
      EMAIL_HOST: "${EMAIL_HOST:-}"
      EMAIL_PORT: "${EMAIL_PORT:-587}"
      EMAIL_HOST_USER: "${EMAIL_HOST_USER:-}"
      EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD:-}"
      DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-}"
    command:
      - sh
      - -ec
      - |
        install -d -m 0755 -o 10001 -g 10001 /data /data/media
        install -d -m 0700 -o 10001 -g 10001 /data/import
        if [ ! -e /data/GestorAcuerdos.sqlite3 ] && [ -s /data/import/GestorAcuerdos.sqlite3 ]; then
          chown 10001:10001 /data/import/GestorAcuerdos.sqlite3
          chmod 600 /data/import/GestorAcuerdos.sqlite3
          mv /data/import/GestorAcuerdos.sqlite3 /data/GestorAcuerdos.sqlite3
        fi
        chown -R 10001:10001 /data/media
        chmod -R u=rwX,go=rX /data/media
        exec setpriv --reuid=10001 --regid=10001 --clear-groups \
          gunicorn --bind 0.0.0.0:8000 --workers 1 Acordemos.wsgi:application
    volumes:
      - acordemos-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 6
    restart: unless-stopped

volumes:
  acordemos-data:
